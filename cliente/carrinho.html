<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Seu pedido | Pedido na Mão</title>
  <meta name="description" content="Revise seus itens, escolha como quer receber e confirme seu pedido.">
  <meta name="theme-color" content="#FFF8F0">

  <link rel="icon" type="image/png" href="../assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/carrinho.css">
</head>
<body class="carrinho-pagina">
  <header class="topo">
    <div class="container topo-conteudo">
      <div class="carrinho-topo-titulo">
        <a class="btn btn-fantasma btn-icone" href="cardapio.html" aria-label="Voltar ao cardápio">
          <span data-icone="voltar"></span>
        </a>
        <div class="carrinho-topo-textos">
          <h1>Seu pedido</h1>
          <p id="restaurante-nome"></p>
        </div>
      </div>
      <span class="marca">
        <img class="marca-logo" src="../assets/img/logo.png" alt="" width="32" height="32" onerror="this.hidden = true">
        <span class="marca-nome">Pedido na Mão</span>
      </span>
    </div>
  </header>

  <main class="container carrinho-main" id="conteudo">
    <!-- Avisos (itens removidos, preço atualizado, erros do envio) -->
    <div class="carrinho-avisos" id="avisos" role="alert"></div>

    <!-- Carregando / vazio / erro -->
    <div id="estado"></div>

    <form class="carrinho-layout" id="form-pedido" novalidate hidden>
      <div class="carrinho-coluna">
        <section aria-labelledby="titulo-itens">
          <h2 class="carrinho-secao-titulo" id="titulo-itens" tabindex="-1">Itens</h2>
          <div class="carrinho-lista" id="lista"></div>
        </section>

        <section aria-labelledby="titulo-recebimento">
          <h2 class="carrinho-secao-titulo" id="titulo-recebimento">Como você quer receber?</h2>
          <div class="opcoes" role="radiogroup" aria-labelledby="titulo-recebimento">
            <label class="opcao">
              <input type="radio" name="tipo" value="retirada_balcao" id="tipo-balcao">
              <span class="opcao-icone" data-icone="sacola" data-tamanho="24"></span>
              <span class="opcao-texto">
                <span class="opcao-titulo">Retirar no balcão</span>
                <span class="opcao-apoio">Você busca quando estiver pronto.</span>
              </span>
            </label>
            <label class="opcao">
              <input type="radio" name="tipo" value="mesa" id="tipo-mesa">
              <span class="opcao-icone" data-icone="mesa" data-tamanho="24"></span>
              <span class="opcao-texto">
                <span class="opcao-titulo">Entregar na mesa</span>
                <span class="opcao-apoio">Levamos até você.</span>
              </span>
            </label>
          </div>

          <div class="campo carrinho-mesa" id="campo-mesa" hidden>
            <label for="mesa">Número da mesa</label>
            <input type="text" id="mesa" name="mesa" maxlength="10" autocomplete="off"
                   autocapitalize="characters" spellcheck="false" aria-describedby="mesa-ajuda mesa-erro">
            <p class="campo-ajuda" id="mesa-ajuda">Letras, números e hífen, até 10 caracteres.</p>
            <p class="campo-mensagem-erro" id="mesa-erro"><span data-icone="alerta" data-tamanho="16"></span><span class="msg-texto"></span></p>
          </div>
        </section>

        <section aria-labelledby="titulo-obs">
          <h2 class="carrinho-secao-titulo" id="titulo-obs">Observação geral do pedido</h2>
          <div class="campo">
            <label class="sr-only" for="obs-geral">Observação geral do pedido (opcional)</label>
            <textarea id="obs-geral" maxlength="200" rows="2" placeholder="Opcional. Ex.: tudo para viagem"
                      aria-describedby="obs-geral-contador"></textarea>
            <p class="campo-ajuda carrinho-contador" id="obs-geral-contador">0/200</p>
          </div>
        </section>
      </div>

      <aside class="carrinho-resumo" aria-labelledby="titulo-resumo">
        <h2 class="carrinho-secao-titulo" id="titulo-resumo">Resumo</h2>
        <dl class="resumo-linhas">
          <div class="resumo-linha"><dt>Subtotal</dt><dd id="resumo-subtotal"></dd></div>
          <div class="resumo-linha resumo-total"><dt>Total</dt><dd id="resumo-total"></dd></div>
        </dl>
        <p class="resumo-aviso">O valor final é confirmado pelo restaurante ao enviar o pedido.</p>
        <button type="submit" class="btn btn-primario btn-grande btn-bloco resumo-botao" data-confirmar>Confirmar pedido</button>
      </aside>
    </form>
  </main>

  <!-- Barra fixa do celular -->
  <div class="rodape-fundo" id="rodape" hidden>
    <div class="rodape-barra">
      <div class="rodape-total">
        <span class="rodape-total-rotulo">Total</span>
        <strong id="rodape-total"></strong>
      </div>
      <button type="submit" form="form-pedido" class="btn btn-primario btn-grande" data-confirmar>Confirmar pedido</button>
    </div>
  </div>

  <script type="module" src="carrinho.js"></script>
</body>
</html>
