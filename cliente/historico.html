<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Meus pedidos | Pedido na Mão</title>
  <meta name="description" content="Veja o histórico dos seus pedidos e peça de novo pelo celular.">
  <meta name="theme-color" content="#FFF8F0">

  <link rel="icon" type="image/png" href="../assets/img/logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/historico.css">
</head>
<body class="historico-pagina">
  <header class="topo">
    <div class="container topo-conteudo">
      <div class="historico-topo-esquerda">
        <a class="btn btn-fantasma btn-icone" href="cardapio.html" aria-label="Voltar ao cardápio">
          <span data-icone="voltar"></span>
        </a>
        <h1 class="historico-topo-titulo">Meus pedidos</h1>
      </div>
      <a class="marca" href="cardapio.html" data-nome-produto>
        <img class="marca-logo" src="../assets/img/logo.png" alt="" width="32" height="32" onerror="console.warn('[marca] não foi possível carregar a logo:', this.getAttribute('src')); this.hidden = true">
        <span class="marca-nome">Pedido na Mão</span>
      </a>
    </div>
  </header>

  <main class="container historico-main" id="conteudo" aria-live="polite">
    <!-- Carregando / vazio / erro -->
    <div id="estado"></div>

    <!-- Lista de pedidos dividida em Em andamento e Anteriores -->
    <div class="historico-listas" id="listas" hidden>
      <section class="historico-secao historico-secao-andamento" id="secao-andamento" aria-labelledby="titulo-andamento" hidden>
        <h2 class="historico-secao-titulo" id="titulo-andamento">Em andamento</h2>
        <div class="historico-grade" id="lista-andamento"></div>
      </section>

      <section class="historico-secao" id="secao-anteriores" aria-labelledby="titulo-anteriores" hidden>
        <h2 class="historico-secao-titulo" id="titulo-anteriores">Anteriores</h2>
        <div class="historico-grade" id="lista-anteriores"></div>
      </section>

      <div class="historico-paginacao" id="paginacao" hidden>
        <button type="button" class="btn btn-secundario" id="btn-carregar-mais">
          Carregar mais
        </button>
      </div>
    </div>
  </main>

  <script type="module" src="historico.js"></script>
</body>
</html>
