<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cardápio | Pedido na Mão</title>
  <meta name="description" content="Veja o cardápio, escolha seus itens e faça seu pedido pelo celular.">
  <meta name="theme-color" content="#FFF8F0">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='18' r='12' fill='%23E03A1E'/%3E%3Cpath d='M16 8c-2-3-6-3-8-1 3 0 5 1 8 1 3 0 5-1 8-1-2-2-6-2-8 1z' fill='%232E9E5B'/%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap">

  <link rel="stylesheet" href="../css/tokens.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/componentes.css">
  <link rel="stylesheet" href="../css/cardapio.css">
</head>
<body class="cardapio-pagina">
  <header class="topo cardapio-topo">
    <div class="container topo-conteudo">
      <span class="topo-logo" data-nome-produto>Pedido na Mão</span>
      <div class="topo-acao">
        <span class="pilula-mesa" id="pilula-mesa" hidden>
          <span data-icone="mesa" data-tamanho="16"></span>
          <span id="pilula-mesa-texto"></span>
        </span>
        <button type="button" class="btn btn-fantasma btn-icone" id="btn-sair" aria-label="Sair">
          <span data-icone="sair"></span>
        </button>
      </div>
    </div>
    <div class="container cardapio-saudacao">
      <h1 id="saudacao">Olá!</h1>
      <p id="restaurante-nome"></p>
    </div>
  </header>

  <div class="container cardapio-busca-area">
    <div class="campo campo-busca">
      <label class="sr-only" for="busca">Buscar no cardápio</label>
      <div class="busca-caixa">
        <span class="busca-icone" data-icone="busca" data-tamanho="20"></span>
        <input type="search" id="busca" name="busca" placeholder="Buscar no cardápio"
               autocomplete="off" enterkeyhint="search" disabled>
      </div>
    </div>
  </div>

  <!-- Abas de categoria: ficam coladas no topo ao rolar -->
  <nav class="cardapio-barra" id="barra-categorias" aria-label="Categorias do cardápio" hidden>
    <div class="container">
      <div class="chips cardapio-chips" id="chips"></div>
    </div>
  </nav>

  <main class="container cardapio-main" id="conteudo" aria-live="polite"></main>

  <!-- Barra do carrinho -->
  <div class="carrinho-fundo" id="carrinho-fundo" hidden>
    <a class="btn btn-primario carrinho-barra" id="carrinho-barra" href="carrinho.html">
      <span class="carrinho-barra-texto" id="carrinho-barra-texto"></span>
      <span class="carrinho-barra-total" id="carrinho-barra-total"></span>
    </a>
  </div>

  <!-- Detalhe do produto: bottom-sheet no celular, modal no desktop -->
  <div class="sobreposicao sobreposicao-sheet" id="detalhe-fundo">
    <div class="sheet detalhe" id="detalhe" role="dialog" aria-modal="true" aria-labelledby="detalhe-nome">
      <div class="detalhe-imagem" id="detalhe-imagem">
        <button type="button" class="btn btn-icone detalhe-fechar" id="detalhe-fechar" aria-label="Fechar">
          <span data-icone="fechar"></span>
        </button>
      </div>

      <h2 class="detalhe-nome" id="detalhe-nome"></h2>
      <p class="detalhe-descricao" id="detalhe-descricao"></p>
      <p class="detalhe-preco" id="detalhe-preco"></p>

      <div class="campo detalhe-obs">
        <label for="detalhe-obs">Alguma observação?</label>
        <textarea id="detalhe-obs" maxlength="140" rows="2" placeholder="ex.: sem cebola"
                  aria-describedby="detalhe-obs-contador"></textarea>
        <p class="campo-ajuda detalhe-contador" id="detalhe-obs-contador">0/140</p>
      </div>

      <div class="detalhe-acoes">
        <div class="seletor" role="group" aria-label="Quantidade">
          <button type="button" id="detalhe-menos" aria-label="Diminuir quantidade"><span data-icone="menos" data-tamanho="20"></span></button>
          <span class="seletor-qtd" id="detalhe-qtd" aria-live="polite">1</span>
          <button type="button" class="seletor-mais" id="detalhe-mais" aria-label="Aumentar quantidade"><span data-icone="mais" data-tamanho="20"></span></button>
        </div>
        <button type="button" class="btn btn-primario btn-grande detalhe-adicionar" id="detalhe-adicionar"></button>
      </div>
    </div>
  </div>

  <script type="module" src="cardapio.js"></script>
</body>
</html>
