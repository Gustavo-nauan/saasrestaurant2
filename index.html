<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido na Mão — Peça pelo celular. Sem fila.</title>
  <meta name="description" content="Escolha, peça e a gente avisa quando estiver pronto. Faça seu pedido no restaurante direto pelo celular, sem fila.">
  <meta name="theme-color" content="#1A0F0A">

  <!-- Open Graph (pré-visualização ao compartilhar o link) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="pt_BR">
  <meta property="og:title" content="Pedido na Mão — Peça pelo celular. Sem fila.">
  <meta property="og:description" content="Escolha, peça e a gente avisa quando estiver pronto.">

  <!-- Favicon da marca -->
  <link rel="icon" type="image/png" href="assets/img/logo.png">

  <!-- Fontes: preconnect acelera o handshake com o Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/componentes.css">
  <link rel="stylesheet" href="css/inicio.css">
</head>
<body>
  <main class="inicio">
    <!-- Mural decorativo: as colunas de fotos são montadas por js/inicio.js -->
    <div class="mural" id="mural" aria-hidden="true"></div>
    <div class="inicio-veu" aria-hidden="true"></div>

    <section class="inicio-conteudo" aria-labelledby="inicio-titulo">
      <p class="inicio-marca entrada">
        <span class="marca">
          <img class="marca-logo" src="assets/img/logo-branca.png" alt="" width="44" height="44" onerror="if (!this.dataset.tentouPadrao) { this.dataset.tentouPadrao = '1'; this.src = 'assets/img/logo.png'; } else { this.hidden = true; }">
          <span class="marca-nome" data-nome-produto>Pedido na Mão</span>
        </span>
      </p>

      <h1 class="inicio-titulo entrada" id="inicio-titulo">Seu pedido em segundos.</h1>

      <p class="inicio-subtitulo entrada">Sem fila para pedir. A gente avisa quando estiver pronto.</p>

      <div class="inicio-acoes entrada">
        <a class="btn btn-primario btn-grande" id="btn-pedido" href="cliente/login.html">
          <span id="btn-pedido-texto">Fazer meu pedido</span>
          <span id="btn-pedido-icone" aria-hidden="true"></span>
        </a>
      </div>
    </section>
  </main>

  <script type="module" src="js/inicio.js"></script>
</body>
</html>
